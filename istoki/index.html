(function(root){

const AB=['STR','DEX','CON','INT','WIS','CHA'];
const RMAP={"СИЛ":"STR","ЛОВ":"DEX","ТЕЛ":"CON","ИНТ":"INT","МУД":"WIS","ОБА":"CHA"};

function abilityTotals(db,p){
 const result=Object.fromEntries(AB.map(k=>[k,0]));
 const orig=cget(db,p.character.origin);for(const x of (orig?.header||[])){let k=(x.icon||'').replace(/^ABILITY_/,'');if(result[k]!==undefined)result[k]+=int(x.quantity||1);}

  let elems=card.kind==='trait'?(card.header||[]):(card.paths?.[h.path]?.grant||[]).map(icon=>({icon,quantity:1}));

 }return result;
}
function storySymbols(db,p){const result={};for(const h of p.story){const c=cget(db,h.cardId);if(!c)continue;let x=c.kind==='trait'?(c.header||[]):(c.paths?.[h.path]?.symbols||[]).map(icon=>({icon,quantity:1}));for(const a of x){if(a.icon?.startsWith('STORY_'))result[a.icon]=(result[a.icon]||0)+int(a.quantity||1);}}return result;}
function storyScore(db,p){
 let triumph=0,tragedy=0;
 for(const h of p.story){const c=cget(db,h.cardId);let d=c?.kind==='trait'?c:(c?.paths?.[h.path]);if(!d)continue;triumph+=int(d.triumph);tragedy+=int(d.tragedy);}
 triumph+=p.played.filter(id=>db.cards[id]?.category==='hero').length;

 p.hand.push(deck.hero.shift());
 const villain=opts.villainId||'EO-VIL-002';if(!db.villains[villain])throw Error('Нет злодея '+villain);

 deck,discard:{hero:[],antihero:[],villain_action:[],story:[]},discardActs:{1:[],2:[],3:[]},market,openActs:[1],
 villain:{cardId:villain,form:'initial',xp:5,plot:'plot_normal',initialCompleted:0,finalCompleted:0,lastAction:null},

 // Starting origin effects are real game state, not player-entered corrections.

 if(char.origin==='EO-ORI-015')p.xp+=3;

function ensure(s,phase){if(s.status!=='in_progress')throw Error('Партия уже завершена');if(s.phase!==phase)throw Error('Сейчас недоступно: '+s.phase+', требуется '+phase);}

"title":"Проклятое сокровище","act":null,"kind":null,"difficulty":null,"text":"Разыграйте эту карту, когда любой герой проходит испытание. Этот герой может получить ⟦ТЬМА:1⟧, чтобы взять ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧.","source":"small/villain_action/small_p09_c09.webp","villainAction":{"trigger":"during_challenge","logic":"optional_darkness_for_action_card","text":"Разыграйте эту карту, когда любой герой проходит испытание. Этот герой может получить ⟦ТЬМА:1⟧, чтобы взять ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧.","readable":"Герой может сместиться на 1 к Тьме ради карты героя или антигероя."}},"EO-VA-010":{"id":"EO-VA-010","category":"villain_action","title":"Узник в беде","act":null,"kind":null,"difficulty":null,"text":"Разыграйте эту карту, когда любой герой проходит испытание. Если этот герой провалит испытание, злодей дополнительно получит ⟦ОПЫТ:1⟧.","source":"small/villain_action/small_p10_c01.webp","villainAction":{"trigger":"during_challenge","logic":"villain_xp_if_challenge_failed","text":"Разыграйте эту карту, когда любой герой проходит испытание. Если этот герой провалит испытание, злодей дополнительно получит ⟦ОПЫТ:1⟧.","readable":"После неудачи испытания злодею дополнительно +1 опыт."}},"EO-VA-011":{"id":"EO-VA-011","category":"villain_action","title":"Превосходящие силы","act":null,"kind":null,"difficulty":null,"text":"Разыграйте эту карту, когда любой герой проходит испытание. Способности класса этого героя не действуют до конца хода.","source":"small/villain_action/small_p10_c02.webp","villainAction":{"trigger":"during_challenge","logic":"suspend_class_powers_this_turn","text":"Разыграйте эту карту, когда любой герой проходит испытание. Способности класса этого героя не действуют до конца хода.","readable":"Отключить способности класса героя до конца хода."}},"EO-VA-012":{"id":"EO-VA-012","category":"villain_action","title":"Бродячий монстр","act":null,"kind":null,"difficulty":null,"text":"Разыграйте эту карту, когда любой герой проходит испытание. Это испытание получает ⟦СЛОЖНОСТЬ:+1⟧.","source":"small/villain_action/small_p10_c03.webp","villainAction":{"trigger":"during_challenge","logic":"difficulty_plus_1","text":"Разыграйте эту карту, когда любой герой проходит испытание. Это испытание получает ⟦СЛОЖНОСТЬ:+1⟧.","readable":"Сложность текущего испытания +1."}},"EO-VA-013":{"id":"EO-VA-013","category":"villain_action","title":"Бродячий монстр","act":null,"kind":null,"difficulty":null,"text":"Разыграйте эту карту, когда любой герой проходит испытание. Это испытание получает ⟦СЛОЖНОСТЬ:+1⟧.","source":"small/villain_action/small_p10_c04.webp","villainAction":{"trigger":"during_challenge","logic":"difficulty_plus_1","text":"Разыграйте эту карту, когда любой герой проходит испытание. Это испытание получает ⟦СЛОЖНОСТЬ:+1⟧.","readable":"Сложность текущего испытания +1 (второй экземпляр той же карты)."}},"EO-VIL-001":{"id":"EO-VIL-001","category":"villain_or_plot_side","title":"План господства / Эпоха тьмы","act":null,"kind":null,"difficulty":null,"text":"План господства:   В начале игры злодей получает ⟦ОПЫТ:5⟧ за каждого игрока, участвующего в партии.\n⟦ЗЛОДЕЙ_ПОЛУЧАЕТ_ОПЫТ:1⟧: когда вы проваливаете испытание (кроме злодея).\n⟦ЗНАК_ЗЛОДЕЯ⟧: злодей разыгрывает карту из своей колоды.\nКогда вы сталкиваетесь со злодеем и результат броска больше сложности, злодей теряет ⟦ОПЫТ⟧ в количестве, равном разнице между сложностью и результатом броска. | Эпоха тьмы:   В начале игры злодей получает ⟦ОПЫТ:5⟧ за каждого игрока, участвующего в партии.\nКогда вы переворачиваете карту злодея на сторону финального злодея, он получает ⟦ОПЫТ:3⟧ за каждого игрока, участвующего в партии.\n⟦ЗЛОДЕЙ_ПОЛУЧАЕТ_ОПЫТ:1⟧: когда вы проваливаете испытание (кроме злодея).\n⟦ЗНАК_ЗЛОДЕЯ⟧: злодей разыгрывает карту из своей колоды.\nКогда вы сталкиваетесь со злодеем и результат броска больше сложности, злодей теряет ⟦ОПЫТ⟧ в количестве, равном разнице между сложностью и результатом броска.","source":"villains/villain_or_plot_side/villains_p01_c01.webp"},"EO-VIL-002":{"id":"EO-VIL-002","category":"villain_or_plot_side","title":"Невеста Тёмного Владыки → Тёмный Владыка","act":null,"kind":null,"difficulty":null,"text":"Невеста Тёмного Владыки: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦ТЬМА:1⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦СВЕТ:1⟧. Получите +2 к результату броска против этого злодея, если в вашей истории есть хотя бы 2 черты. | Тёмный Владыка: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦ТЬМА:1⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦СВЕТ:1⟧. ⟦ЗНАК_ЗЛОДЕЯ⟧: получите ⟦ТЬМА:1⟧ или -1 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p01_c02.webp"},"EO-VIL-003":{"id":"EO-VIL-003","category":"villain_or_plot_side","title":"Отродье Чудовища → Чудовище из легенд","act":null,"kind":null,"difficulty":null,"text":"Отродье Чудовища: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой тратит ⟦ОПЫТ:1⟧, чтобы добавить к броску руну Тьмы. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой отправляется в странствие. Получите +2 к результату броска против этого злодея, если в вашей истории есть хотя бы 4 испытания. | Чудовище из легенд: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой тратит ⟦ОПЫТ:1⟧, чтобы добавить к броску руну Тьмы. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой отправляется в странствие. ⟦ЗНАК_ЗЛОДЕЯ⟧: потратьте ⟦ОПЫТ:1⟧ или получите -1 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p01_c03.webp"},"EO-VIL-004":{"id":"EO-VIL-004","category":"villain_or_plot_side","title":"Падший ангел → Ложный бог","act":null,"kind":null,"difficulty":null,"text":"Падший ангел: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ТРАГЕДИЯ⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ТРИУМФ⟧ в историю. Получите +2 к результату броска против этого злодея, если в вашей истории больше ⟦ТРИУМФ⟧, чем ⟦ТРАГЕДИЯ⟧. | Ложный бог: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ТРАГЕДИЯ⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ТРИУМФ⟧ в историю. ⟦ЗНАК_ЗЛОДЕЯ⟧: если вы пытаетесь пройти испытание по пути ⟦ТРАГЕДИЯ⟧, получите -1 к результату броска.","source":"villains/villain_or_plot_side/villains_p01_c04.webp"},"EO-VIL-005":{"id":"EO-VIL-005","category":"villain_or_plot_side","title":"Спящий Древний → Великий Древний","act":null,"kind":null,"difficulty":null,"text":"Спящий Древний: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦МАГИЯ⟧ или ⟦ЗЛОДЕЙСТВО⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ПРИРОДА⟧ или ⟦ВЕРА⟧ в историю. Столкнувшись с этим злодеем, до броска рун вы можете сбросить из руки сколько угодно ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧, чтобы получить +1 к результату броска за каждую. | Великий Древний: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦МАГИЯ⟧ или ⟦ЗЛОДЕЙСТВО⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦ПРИРОДА⟧ или ⟦ВЕРА⟧ в историю. ⟦ЗНАК_ЗЛОДЕЯ⟧: уберите любую руну способности из результата броска.","source":"villains/villain_or_plot_side/villains_p03_c01.webp"},"EO-VIL-006":{"id":"EO-VIL-006","category":"villain_or_plot_side","title":"Королева драконов → Древний дракон","act":null,"kind":null,"difficulty":null,"text":"Королева драконов: Злодей получает ⟦ОПЫТ:1⟧. Когда любой игрок разыгрывает ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает новую способность карты класса. Получите +2 к результату броска против этого злодея, если у вас есть хотя бы 4 ⟦ОПЫТ⟧ в запасе либо на карте класса. | Древний дракон: Злодей получает ⟦ОПЫТ:1⟧. Когда любой игрок разыгрывает ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает новую способность карты класса. ⟦ЗНАК_ЗЛОДЕЯ⟧: сбросьте ⟦КАРТА_АНТИГЕРОЯ⟧ из руки или получите -1 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p03_c02.webp"},"EO-VIL-007":{"id":"EO-VIL-007","category":"villain_or_plot_side","title":"Мастер подземелья → Мучитель","act":null,"kind":null,"difficulty":null,"text":"Мастер подземелья: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой разыгрывает ⟦КАРТА_ГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет путь с ⟦СЛОЖНОСТЬ:+1⟧ в историю. Получите +2 к результату броска против этого злодея, если в вашей истории больше ⟦ТРАГЕДИЯ⟧, чем ⟦ТРИУМФ⟧. | Мучитель: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой разыгрывает ⟦КАРТА_ГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет путь с ⟦СЛОЖНОСТЬ:+1⟧ в историю. ⟦ЗНАК_ЗЛОДЕЯ⟧: сбросьте ⟦КАРТА_ГЕРОЯ⟧ из руки или получите -1 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p03_c03.webp"},"EO-VIL-008":{"id":"EO-VIL-008","category":"villain_or_plot_side","title":"Обезумевший сектант → Верховный жрец","act":null,"kind":null,"difficulty":null,"text":"Обезумевший сектант: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦БЛАГОРОДСТВО⟧ или ⟦СПРАВЕДЛИВОСТЬ⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦МАГИЯ⟧ или ⟦ЗЛОДЕЙСТВО⟧ в историю. Столкнувшись с этим злодеем, вы можете бесплатно добавлять руны Тьмы к броску. | Верховный жрец: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦БЛАГОРОДСТВО⟧ или ⟦СПРАВЕДЛИВОСТЬ⟧ в историю. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой добавляет ⟦МАГИЯ⟧ или ⟦ЗЛОДЕЙСТВО⟧ в историю. ⟦ЗНАК_ЗЛОДЕЯ⟧: бросьте руну Тьмы и добавьте её к броску.","source":"villains/villain_or_plot_side/villains_p03_c04.webp"},"EO-VIL-009":{"id":"EO-VIL-009","category":"villain_or_plot_side","title":"Чернокнижник → Демон","act":null,"kind":null,"difficulty":null,"text":"Чернокнижник: Злодей получает ⟦ОПЫТ:1⟧. Когда герой проходит испытание, разыграв на себя ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой игрок сбрасывает карту. Столкнувшись с этим злодеем, перед броском вы можете взять до 3 ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧. Получите -1 к результату броска за каждую. | Демон: Злодей получает ⟦ОПЫТ:1⟧. Когда герой проходит испытание, разыграв на себя ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой игрок сбрасывает карту. ⟦ЗНАК_ЗЛОДЕЯ⟧: получите -2 к результату броска и возьмите ещё одну ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧.","source":"villains/villain_or_plot_side/villains_p05_c01.webp"},"EO-VIL-010":{"id":"EO-VIL-010","category":"villain_or_plot_side","title":"Чёрный всадник → Тиран","act":null,"kind":null,"difficulty":null,"text":"Чёрный всадник: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой проваливает испытание с разницей в 2 или более. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой проходит испытание с разницей в 3 или более. Получите +2 к результату броска против этого злодея, если у вас нет ⟦ОПЫТ⟧, не считая ⟦ОПЫТ⟧ на карте класса. | Тиран: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой проваливает испытание с разницей в 2 или более. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой проходит испытание с разницей в 3 или более. ⟦ЗНАК_ЗЛОДЕЯ⟧: если у вас есть хотя бы 4 ⟦ОПЫТ⟧, получите -2 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p05_c02.webp"},"EO-VIL-011":{"id":"EO-VIL-011","category":"villain_or_plot_side","title":"Лютый волк → Чародейка","act":null,"kind":null,"difficulty":null,"text":"Лютый волк: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой использует ⟦ДВОЙНОЙ_ТРЕУГОЛЬНИК⟧, чтобы взять ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой использует ⟦ДВОЙНОЙ_ТРЕУГОЛЬНИК⟧ для активации эффекта наследия. Получите +2 к результату броска против этого злодея, если при столкновении с ним у вас нет карт в руке. | Чародейка: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой использует ⟦ДВОЙНОЙ_ТРЕУГОЛЬНИК⟧, чтобы взять ⟦КАРТА_ГЕРОЯ⟧ или ⟦КАРТА_АНТИГЕРОЯ⟧. Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой использует ⟦ДВОЙНОЙ_ТРЕУГОЛЬНИК⟧ для активации эффекта наследия. ⟦ЗНАК_ЗЛОДЕЯ⟧: сбросьте все карты из руки или получите -2 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p05_c03.webp"},"EO-VIL-012":{"id":"EO-VIL-012","category":"villain_or_plot_side","title":"Король преступного мира → Полководец","act":null,"kind":null,"difficulty":null,"text":"Король преступного мира: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой проходит испытание с разницей в 3 или более. Злодей теряет ⟦ОПЫТ:1⟧. Когда результат броска равен сложности испытания. Получите +1 к результату броска против этого злодея за каждый ⟦СВЕТ⟧ у вашего героя. | Полководец: Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой проходит испытание с разницей в 3 или более. Злодей теряет ⟦ОПЫТ:1⟧. Когда результат броска равен сложности испытания. ⟦ЗНАК_ЗЛОДЕЯ⟧: вы не можете брать ⟦КАРТА_ГЕРОЯ⟧ в этом ходу.","source":"villains/villain_or_plot_side/villains_p05_c04.webp"}},"villains":{"EO-VIL-002":{"initial":{"title":"Невеста Тёмного Владыки","difficulty":6,"runes":["ТЕЛ","ОБА"],"reward":"герой","finalScoreType":null,"finalScoreAmount":null,"finalScoreIcon":null,"gainXp":"Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦ТЬМА:1⟧.","loseXp":"Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦СВЕТ:1⟧.","special":"Получите +2 к результату броска против этого злодея, если в вашей истории есть хотя бы 2 черты.","source":"villains/villain_or_plot_side/villains_p01_c02.webp"},"final":{"title":"Тёмный Владыка","difficulty":8,"runes":["ТЕЛ","ОБА"],"reward":"триумф: 7, значок ТЕЛ","finalScoreType":"триумф","finalScoreAmount":7,"finalScoreIcon":"ТЕЛ","gainXp":"Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦ТЬМА:1⟧.","loseXp":"Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой получает ⟦СВЕТ:1⟧.","special":"⟦ЗНАК_ЗЛОДЕЯ⟧: получите ⟦ТЬМА:1⟧ или -1 к результату текущего броска.","source":"villains/villain_or_plot_side/villains_p02_c01.webp"}},"EO-VIL-003":{"initial":{"title":"Отродье Чудовища","difficulty":6,"runes":["СИЛ","ЛОВ"],"reward":"герой","finalScoreType":null,"finalScoreAmount":null,"finalScoreIcon":null,"gainXp":"Злодей получает ⟦ОПЫТ:1⟧. Когда любой герой тратит ⟦ОПЫТ:1⟧, чтобы добавить к броску руну Тьмы.","loseXp":"Злодей теряет ⟦ОПЫТ:1⟧. Когда любой герой отправляется в странствие.","speci  if(p.fateful>0)info+=`<div class="infoBlock">${I('rune_double_tri')} <b>Знак судьбы</b>: выбери свой эффект наследия. ${I('villain_trigger')} Действие злодея открывается автоматически.<div class="rollButtons"><button class="modalButton" data-fate="hero">${I('action_hero')} Карта героя</button><button class="modalButton" data-fate="antihero">${I('action_anti')} Карта антигероя</button><button class="modalButton" data-fate="special">Особое наследие</button></div></div>`;
 let effects=(p.manual||[]).filter(x=>!p.ignoreVillain||!x.startsWith('Действие злодея:'));
 if(effects.length)info+=`<div class="infoBlock"><b>Разрешить вручную по карте:</b>${effects.map(x=>`<p>${tagged(x)}</p>`).join('')}<label><input type="checkbox" id="effectsDone"> Условия учтены</label></div>`;
 const eligibleMarkup=eligible.length?`<div class="rollLine">${eligible.map(x=>`<button class="ctrl" data-view="${x.id}" style="padding:4px"><img src="${IMG(x.id)}" class="actionCardMini" title="${H(x.card.title)}"></button>`).join('')}</div>`:'<p class="smallPrint">В текущем окне подходящих карт на руке нет.</p>';
 modal(base+`<div class="rollLine">${faces}</div><div class="rollSummary"><span>Результат</span><strong>${p.rollTotal}</strong><span>Сложность ${p.difficulty}</span><span class="${p.rollTotal+p.bonus>=p.difficulty?'ok':'warn'}">${p.rollTotal+p.bonus>=p.difficulty?'Предварительно успех':'Предварительно неудача'}</span>${p.darkSymbols?iconNum('alignment_down',p.darkSymbols):''}</div>${info}<div><b>Карты на руке для вмешательства</b>${eligibleMarkup}</div><div class="rollSummary">Дополнительный модификатор: <input id="rollBonus" class="formControl" type="number" value="${p.bonus}" min="-30" max="30"><button class="modalButton" data-modifier>Применить</button></div><div class="rollButtons"><button class="goldBtn" data-finish ${p.fateful?'disabled':''}>Применить результат</button><button class="modalButton" data-close>Свернуть</button></div>`,'reacting');
}
function pager(page,pages,dataName,extra=''){
 if(pages<=1)return '';
 return `<div class="pageControls"><button data-${dataName}="${extra}${Math.max(0,page-1)}" ${page===0?'disabled':''}>‹</button><span>${page+1} / ${pages}</span><button data-${dataName}="${extra}${Math.min(pages-1,page+1)}" ${page===pages-1?'disabled':''}>›</button></div>`;
}
function handsModal(page=0){
 const ids=hero().hand,total=Math.max(1,Math.ceil(ids.length/4));page=Math.max(0,Math.min(page,total-1));
 const cs=ids.slice(page*4,(page+1)*4).map(id=>`<button class="modalButton" data-view="${id}"><img class="actionCardMini" src="${IMG(id)}" title="${H(card(id)?.title)}"><div>${H(card(id)?.title)}</div></button>`).join('');
 modal(`${head('Карты на руке · '+ids.length)}<div class="rollLine">${cs||'Пока пусто'}</div>${pager(page,total,'handpage')}`,'hand');
}
function scoreModal(){const s=E.storyScore(DB,hero());modal(`${head('Промежуточные очки судьбы')}<div class="rollSummary">${iconNum('score_triumph',s.triumph)}${iconNum('score_tragedy',s.tragedy)}${iconNum('resource_xp',s.remainingXp)}<b>Знаки: ${s.symbolPts}</b><b>Пока ${s.subtotal}</b></div><div class="infoBlock">Это промежуточная оценка: ${s.notIncluded.join(', ')} ещё не включены в автоматический подсчёт.</div>`,'score');}
function classModal(){const p=hero(),c=card(p.character.class),tiers=c?.dev?.tiers||[];
 const html=tiers.map(t=>{const x=Number(t.required_committed_xp),active=p.classXp>=x;
 return `<div class="tierLine ${active?'tierActive':''}"><strong>${I('resource_xp','tinyIcon')} ${x} ${active?'✓':'○'}</strong><span>${tagged(t.effect_tagged)}</span></div>`;}).join('');
 modal(`${head('Класс · '+c.title)}<div class="classDevelopment"><img class="classDevCard" src="${IMG(c.id)}"><div class="classDevControls"><div class="rollSummary">${iconNum('resource_xp',p.xp)} свободно · ${iconNum('resource_xp',p.classXp)} вложено</div>${html}<div class="rollButtons"><button class="goldBtn" data-quickclass="1" ${state.phase==='turn'&&p.xp>0&&p.classXp<6?'':'disabled'}>+1 опыт</button><button class="goldBtn" data-quickclass="${p.classXp<2?2-p.classXp:p.classXp<4?4-p.classXp:p.classXp<6?6-p.classXp:1}" ${state.phase==='turn'&&p.xp>=(p.classXp<2?2-p.classXp:p.classXp<4?4-p.classXp:6-p.classXp)&&p.classXp<6?'':'disabled'}>До следующей ступени</button></div><p class="smallPrint">Бонусы первых двух ступеней автоматически учитываются при подходящих проверках. Некоторые эффекты третьей ступени пока требуют ручной проверки по тексту карты.</p></div></div>`,'class');
}

function adjustModal(){modal(`${head('Корректировка неавтоматизированного эффекта')}<p class="smallPrint">Используй для свойств карт, пока требующих ручного разрешения.</p><div class="rollSummary">${I('resource_xp')} Герой <input id="xpDelta" class="formControl" type="number" value="0"><button class="modalButton" data-adjustxp>Применить</button></div><div class="rollSummary">${I('villain_gain_xp')} Злодей <input id="vxpDelta" class="formControl" type="number" value="0"><button class="modalButton" data-adjustvillain>Применить</button></div><div class="rollSummary">${I('alignment_down')} Шкала <input id="alignmentDelta" class="formControl" type="number" value="0"><button class="modalButton" data-adjustalign>Применить</button></div>`,'adjust');}
function helpModal(){modal(`${head('Проверяемая альфа 0.3')}<p>Одиночная кооперативная партия без кампании: общий фиксированный стол 3×5, реальные изображения карт, сбор персонажа, виртуальные двусторонние руны и проверка доступных карт реакций.</p><p>Для 1–3 участников по правилам используются 4 карты в каждом акте. Пятая ячейка сохраняет размер раскладки и предусмотрена для будущей партии вчетвером.</p><div class="infoBlock">Пока требуют ручной проверки: часть индивидуальных свойств, эффекты злодея и наследия, применение сложных карт действий, повторный бросок и окончательный подсчёт. Результаты рун рассчитываются автоматически. Без API.</div><div class="rollButtons"><button class="modalButton" data-export>Экспорт JSON</button><button class="modalButton" data-import>Загрузить JSON</button></div>`,'help');}
function plotModal(){modal(`${head('Злодейский замысел')}<p>В одиночной партии злодей начинает с 5 ${I('resource_xp')}. Когда результат боя <b>строго выше</b> сложности, злодей теряет опыт в размере разницы.</p><p>Когда испытание провалено, злодей получает опыт. Особые варианты замысла и эффекты конкретного злодея требуют подтверждения по изображениям.</p>`,'plot');}
function logModal(page=0){
 const events=(state.events||[]).slice(-35).reverse(),total=Math.max(1,Math.ceil(events.length/7));page=Math.max(0,Math.min(page,total-1));
 modal(`${head('Журнал событий')}<div>${events.slice(page*7,(page+1)*7).map(x=>`<p class="pathLine"><small class="smallPrint">Ход ${x.turn}</small> ${H(x.text)}</p>`).join('')||'Событий пока нет'}</div>${pager(page,total,'logpage')}`,'log');
}
function exportSave(){const b=new Blob([JSON.stringify({format:'istoki-save-v3',game:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.download='istoki_save_03.json';a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const d=JSON.parse(await input.files[0].text());if(!['istoki-save-v1','istoki-save-v2','istoki-save-v3'].includes(d.format)||d.game?.schema!==1)throw Error('Неподдерживаемый формат');state=d.game;closeModal();save();render();}catch(e){alert(e.message);}};input.click();}
function originActionModal(){modal(`${head('Беглец · выбор действия')}<p>После странствия возьми одну карту:</p><div class="rollButtons"><button class="goldBtn" data-originpick="hero">${I('action_hero')} Героя</button><button class="goldBtn" data-originpick="antihero">${I('action_anti')} Антигероя</button></div>`,'origin');}
function discardModal(act,page=0){
 const ids=(state.discardActs?.[act]||[]).slice().reverse(),total=Math.max(1,Math.ceil(ids.length/5));page=Math.max(0,Math.min(page,total-1));
 modal(`${head('Сброс акта '+act+' · '+ids.length)}<div class="rollLine">${ids.length?ids.slice(page*5,(page+1)*5).map(id=>`<button class="discardFace" data-view="${id}">${src(id)}<span>${H(card(id)?.title)}</span></button>`).join(''):'В этой стопке пока нет карт.'}</div>${pager(page,total,'discardpage',act+':')}`,'discard');
}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else{await document.documentElement.requestFullscreen({navigationUI:'hide'});}adapt();}catch(e){modal(`${head('Полный экран')}<p>Браузер не разрешил полноэкранный режим для локального файла. В Chrome попробуй меню браузера или «Добавить на главный экран». Это ограничение браузера, а не игрового поля.</p><button class="modalButton" data-close>Понятно</button>`);}}
let swipeStart=null;
document.addEventListener('touchstart',e=>{const x=e.target.closest('[data-swipe]');if(x)swipeStart={type:x.dataset.swipe,y:e.touches[0].clientY,x:e.touches[0].clientX};},{passive:true});
document.addEventListener('touchend',e=>{if(!swipeStart)return;const y=e.changedTouches[0].clientY-swipeStart.y,x=e.changedTouches[0].clientX-swipeStart.x;if(Math.abs(y)>25&&Math.abs(y)>Math.abs(x)){swingChoice(swipeStart.type,y<0?1:-1);}swipeStart=null;},{passive:true});
document.addEventListener('click',event=>{
 const t=event.target.closest('button,[data-zoom]');if(!t)return;const d=t.dataset;
 if(d.close!==undefined){closeModal();return;}
 if(d.zoom){event.stopPropagation();return openZoom(d.zoom);}
 if(d.setupchoose){const [cat,id]=d.setupchoose.split(':');return setChoice(cat,id);}
 if(d.swing){const [cat,step]=d.swing.split(':');return swingChoice(cat,Number(step));}
 if(d.vswitch)return changeVillain(Number(d.vswitch));
 if(d.newdeal)return startSetup();
 if(d.startgame!==undefined)return safe(()=>{state=E.createGame(DB,picks,{villainId:villainChoice});closeModal();});
 if(d.new!==undefined){if(confirm('Начать новую партию?'))return startSetup();return;}
 if(d.market){const [a,i]=d.market.split(':').map(Number);return openCard(state.market[a]?.[i],d.market);}
 if(d.discardpage){const [act,page]=d.discardpage.split(':').map(Number);return discardModal(act,page);}
 if(d.handpage!==undefined)return handsModal(Number(d.handpage));
 if(d.logpage!==undefined)return logModal(Number(d.logpage));
 if(d.discard)return discardModal(Number(d.discard));
 if(d.view)return openCard(d.view);
 if(d.vother)return openZoom(d.vother);
 if(d.travel){const [a,i]=d.travel.split(':').map(Number);return safe(()=>{E.travel(DB,state,a,i);closeModal();if(hero().originChoicePending)originActionModal();});}
 if(d.originpick){return safe(()=>{E.chooseOriginAction(DB,state,d.originpick);closeModal();});}
 if(d.attempt){const [a,i,path]=d.attempt.split(':');return safe(()=>{E.chooseMarket(DB,state,Number(a),Number(i),path);closeModal();},{phase:true});}
 if(d.fight!==undefined)return safe(()=>E.startVillain(DB,state),{phase:true});
 if(d.phase!==undefined)return phaseModal();
 if(d.darkplus!==undefined)return safe(()=>E.addDarkRunes(DB,state,state.pending.darkRunes+1),{phase:true});
 if(d.autroll!==undefined)return safe(()=>{let res=R.roll(state.pending);E.submitRoll(DB,state,res);},{phase:true});
 if(d.fate)return safe(()=>E.rollChoice(DB,state,d.fate),{phase:true});
 if(d.modifier!==undefined)return safe(()=>E.setModifier(state,$('rollBonus').value),{phase:true});
 if(d.finish!==undefined)return safe(()=>{if(state.pending.manual?.length&&!state.pending.ignoreVillain&&!$('effectsDone')?.checked)throw Error('Сначала отметь, что эффекты разрешены');E.finishRoll(DB,state);closeModal();});
 if(d.play)return safe(()=>{const e=E.eligibleActions(DB,state).find(x=>x.id===d.play);if(e?.eligibility==='conditional'&&!confirm('Все условия карты соблюдены?'))return;E.playAction(DB,state,d.play);closeModal();},{phase:state?.pending?true:false});
 if(d.next!==undefined)return safe(()=>E.nextTurn(DB,state));
 if(d.hands!==undefined)return handsModal();
 if(d.score!==undefined)return scoreModal();
 if(d.classxp!==undefined||d.classcard!==undefined)return classModal();
 if(d.quickclass!==undefined){safe(()=>E.investClass(state,Number(d.quickclass)));return classModal();}
 if(d.confirmclass!==undefined)return safe(()=>{E.investClass(state,$('classAmount').value);closeModal();});
 if(d.adjust!==undefined)return adjustModal();
 if(d.adjustxp!==undefined)return safe(()=>{E.editXp(state,$('xpDelta').value);closeModal();});
 if(d.adjustvillain!==undefined)return safe(()=>{E.editVillainXp(state,$('vxpDelta').value);closeModal();});
 if(d.adjustalign!==undefined)return safe(()=>{E.changeAlignment(state,DB,$('alignmentDelta').value);closeModal();});
 if(d.vlast!==undefined)return state.villain.lastAction?openCard(state.villain.lastAction):logModal();
 if(d.plot!==undefined)return plotModal();
 if(d.help!==undefined)return helpModal();
 if(d.fullscreen!==undefined)return toggleFullscreen();
 if(d.save!==undefined||d.export!==undefined)return exportSave();
 if(d.import!==undefined)return importSave();
});
$('nativeOverlay').addEventListener('click',e=>{if(e.target===$('nativeOverlay'))closeModal();});
window.ISTOKI_DEBUG={Engine:E,Runes:R,DB,getState:()=>state,setState:s=>{state=s;save();render();},setup:()=>startSetup(),phaseModal,openZoom,render};
render();
})();
</script></body></html>
