<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Kart • 3D полигон</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#111b31;color:#fff}
body{background:radial-gradient(ellipse 65% 55% at 50% 54%,#485e7b 0%,#233248 56%,#101b30 100%)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
header{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:10px}
.title{display:flex;align-items:center;gap:10px;background:#111b30cc;border:1px solid #7785a144;border-radius:15px;padding:9px 13px;box-shadow:0 8px 20px #0b102440;backdrop-filter:blur(8px)}
.dot{width:12px;height:12px;border-radius:50%;background:#fb345a;box-shadow:0 0 0 3px #fb345a33}
h1{font-size:14px;line-height:1.2;margin:0;font-weight:800;letter-spacing:.04em}
.subtitle{font-size:11px;color:#b9c3da;margin-top:3px}
.download{pointer-events:auto;font-size:12px;font-weight:700;color:#141c31;background:#f7e9e8;border-radius:12px;padding:12px 14px;text-decoration:none;white-space:nowrap}
#status{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);font-size:13px;background:#111b30bb;border-radius:10px;padding:10px 14px;pointer-events:none}
.bottom{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:center;pointer-events:none}
.buttons{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;flex-wrap:wrap;background:#111b30de;border:1px solid #ffffff26;padding:7px;border-radius:18px;box-shadow:0 10px 30px #080c2099;backdrop-filter:blur(8px)}
button{border:none;border-radius:11px;background:#35465f;color:#eef3ff;font-size:12px;min-height:35px;padding:8px 11px;cursor:pointer;font-weight:650}
button.active{background:#f3475e;color:white}
.instructions{position:absolute;left:0;right:0;bottom:87px;text-align:center;font-size:12px;color:#d2dcef;opacity:.84;pointer-events:none;text-shadow:0 2px 6px #111a2e}
@media(max-width:440px){.instructions{bottom:96px}.title{padding:8px 10px}.download{padding:10px 11px}button{font-size:11px;padding:8px 9px}.buttons{gap:5px}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Вращаемая 3D-модель красной гоночной машинки"></canvas>
<header><div class="title"><div class="dot"></div><div><h1>RED KART · 3D</h1><div class="subtitle">Одноместный кокпит · тест модели</div></div></div><a class="download" href="./red-kart.glb" download="red-kart.glb">↓ Скачать GLB</a></header>
<div id="status">Загрузка настоящей 3D-модели…</div>
<div class="instructions">Пальцем — вращать · двумя пальцами — масштаб</div>
<div class="bottom"><div class="buttons">
<button data-view="front">Спереди</button><button data-view="right">Справа</button><button data-view="rear">Сзади</button><button data-view="top">Сверху</button><button data-view="three" class="active">3/4</button><button id="spin">⟳ Авто</button>
</div></div>
<script>
(async function(){
'use strict';
const canvas=document.getElementById('stage'), status=document.getElementById('status');
const gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:false});
if(!gl){status.textContent='На этом устройстве не запустился WebGL.';return;}
const vs='attribute vec3 a_position;attribute vec3 a_normal;uniform mat4 u_mvp;varying vec3 v_n;varying vec3 v_p;void main(){v_n=a_normal;v_p=a_position;gl_Position=u_mvp*vec4(a_position,1.0);}';
const fs='precision mediump float;varying vec3 v_n;varying vec3 v_p;uniform vec4 u_color;void main(){vec3 n=normalize(v_n);if(!gl_FrontFacing)n=-n;vec3 l=normalize(vec3(-0.36,0.88,-0.62));float diff=max(dot(n,l),0.0);float spec=pow(max(dot(reflect(-l,n),normalize(vec3(0.4,0.45,-0.75))),0.0),22.0)*0.15;vec3 c=u_color.rgb*(0.57+0.43*diff)+spec;gl_FragColor=vec4(c,u_color.a);}';
function shader(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
const pg=gl.createProgram();gl.attachShader(pg,shader(gl.VERTEX_SHADER,vs));gl.attachShader(pg,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pg);if(!gl.getProgramParameter(pg,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pg));gl.useProgram(pg);
const aP=gl.getAttribLocation(pg,'a_position'),aN=gl.getAttribLocation(pg,'a_normal'),uM=gl.getUniformLocation(pg,'u_mvp'),uC=gl.getUniformLocation(pg,'u_color');
function vecSub(a,b){return a.map((v,i)=>v-b[i])}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}function norm(a){let l=Math.hypot(...a)||1;return a.map(v=>v/l)}
function view(eye,target){const z=norm(vecSub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function perspective(fov,aspect,near,far){const f=1/Math.tan(fov/2);return[f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]}
function multiply(a,b){const m=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)m[c*4+r]+=a[k*4+r]*b[c*4+k];return m}
let yaw=2.4,pitch=.35,dist=5.35,auto=false,ready=false;
const scene=[];
try{
 const response=await fetch('./red-kart.glb',{cache:'no-cache'});if(!response.ok)throw Error('GLB '+response.status);
 const ab=await response.arrayBuffer(),dv=new DataView(ab);
 if(dv.getUint32(0,true)!==0x46546c67||dv.getUint32(4,true)!==2)throw Error('Неверный формат GLB');
 const jl=dv.getUint32(12,true),j=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jl))),start=20+jl+8;
 for(const p of j.meshes[0].primitives){
   const pos=j.accessors[p.attributes.POSITION],pn=j.bufferViews[pos.bufferView],normal=j.accessors[p.attributes.NORMAL],nn=j.bufferViews[normal.bufferView],ix=j.accessors[p.indices],iv=j.bufferViews[ix.bufferView];
   const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Uint8Array(ab,start+pn.byteOffset,pn.byteLength),gl.STATIC_DRAW);
   const nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,new Uint8Array(ab,start+nn.byteOffset,nn.byteLength),gl.STATIC_DRAW);
   const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint8Array(ab,start+iv.byteOffset,iv.byteLength),gl.STATIC_DRAW);
   scene.push({pb,nb,ib,count:ix.count,type:ix.componentType===5123?gl.UNSIGNED_SHORT:gl.UNSIGNED_INT,color:j.materials[p.material].pbrMetallicRoughness.baseColorFactor});
 }
 ready=true;status.style.display='none';
}catch(e){console.error(e);status.textContent='Ошибка загрузки модели: '+e.message;return;}
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
function render(){
 if(!ready)return;
 const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
 if(auto)yaw+=0.006;
 const target=[0,.80,0],eye=[dist*Math.sin(yaw)*Math.cos(pitch),target[1]+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)];
 const mvp=multiply(perspective(Math.PI/4,canvas.width/canvas.height,.05,100),view(eye,target));
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(pg);gl.uniformMatrix4fv(uM,false,mvp);
 for(const p of scene){gl.bindBuffer(gl.ARRAY_BUFFER,p.pb);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,p.nb);gl.enableVertexAttribArray(aN);gl.vertexAttribPointer(aN,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.ib);gl.uniform4fv(uC,p.color);gl.drawElements(gl.TRIANGLES,p.count,p.type,0)}
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
const pointers=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);auto=false;document.getElementById('spin').classList.remove('active')});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointers.size===1){yaw+=(e.clientX-prev[0])*.012;pitch=Math.max(-.12,Math.min(1.43,pitch+(e.clientY-prev[1])*.009));document.querySelectorAll('button[data-view]').forEach(b=>b.classList.remove('active'));}
 else if(pointers.size>=2){const arr=[...pointers.values()],d=Math.hypot(arr[0][0]-arr[1][0],arr[0][1]-arr[1][1]);if(pinch!==null)dist=Math.max(3.2,Math.min(9.8,dist*pinch/d));pinch=d}
});
function up(e){pointers.delete(e.pointerId);pinch=null}canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.2,Math.min(9.8,dist*Math.exp(e.deltaY*.001)))},{passive:false});
for(const b of document.querySelectorAll('button[data-view]'))b.addEventListener('click',()=>{
 const mode=b.dataset.view;const views={front:[Math.PI,.15],right:[Math.PI/2,.2],rear:[0,.13],top:[Math.PI,1.42],three:[2.4,.35]};
 [yaw,pitch]=views[mode];dist=5.35;auto=false;document.getElementById('spin').classList.remove('active');document.querySelectorAll('button[data-view]').forEach(x=>x.classList.toggle('active',x===b));
});
document.getElementById('spin').addEventListener('click',e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto)});
})();
</script>
<script>
/* Canvas2D software fallback for browsers/devices without WebGL. Same GLB geometry. */
(async function(){
 const canvas=document.getElementById('stage');
 if(canvas.getContext('webgl'))return;
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const status=document.getElementById('status');status.textContent='Загрузка модели в режиме совместимости…';
 const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let d=Math.hypot(...a)||1;return a.map(x=>x/d)};
 let yaw=2.4,pitch=.35,dist=5.35,auto=false,meshes=[];
 try{
  const response=await fetch('./red-kart.glb');if(!response.ok)throw Error('HTTP '+response.status);
  const ab=await response.arrayBuffer(),dv=new DataView(ab),jsonLen=dv.getUint32(12,true);
  const j=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jsonLen))),start=28+jsonLen;
  for(const p of j.meshes[0].primitives){
   const a=j.accessors[p.attributes.POSITION],v=j.bufferViews[a.bufferView],i=j.accessors[p.indices],iv=j.bufferViews[i.bufferView];
   const positions=new Float32Array(ab.slice(start+v.byteOffset,start+v.byteOffset+v.byteLength));
   const raw=ab.slice(start+iv.byteOffset,start+iv.byteOffset+iv.byteLength);
   const indices=i.componentType===5123?new Uint16Array(raw):new Uint32Array(raw);
   const base=j.materials[p.material].pbrMetallicRoughness.baseColorFactor;
   const faces=[];
   for(let k=0;k<indices.length;k+=3){
    const ia=indices[k]*3,ib=indices[k+1]*3,ic=indices[k+2]*3;
    const aa=[positions[ia],positions[ia+1],positions[ia+2]],bb=[positions[ib],positions[ib+1],positions[ib+2]],cc=[positions[ic],positions[ic+1],positions[ic+2]];
    const n=norm(cross(sub(bb,aa),sub(cc,aa))),lit=.62+.38*Math.abs(dot(n,norm([-.3,.8,-.55])));
    faces.push([indices[k],indices[k+1],indices[k+2],'rgb('+base.slice(0,3).map(x=>Math.min(255,Math.round(255*x*lit))).join(',')+')']);
   }
   meshes.push({positions,faces});
  }
  status.textContent='Режим совместимости · 3D-модель загружена';
  setTimeout(()=>{status.style.display='none'},2300);
 }catch(e){status.textContent='Не удалось загрузить модель: '+e.message;return;}
 let frameQueued=false;
 function draw(){
  frameQueued=false;
  const dpr=Math.min(devicePixelRatio||1,1.35),w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  ctx.clearRect(0,0,w,h);
  const eye=[dist*Math.sin(yaw)*Math.cos(pitch),.8+dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch)];
  const fwd=norm(sub([0,.8,0],eye)),right=norm(cross(fwd,[0,1,0])),up=cross(right,fwd);
  const focal=.88*h,screen=[];
  for(const m of meshes){
   const p=m.positions,projected=new Float32Array(p.length);
   for(let k=0;k<p.length;k+=3){
    const rel=[p[k]-eye[0],p[k+1]-eye[1],p[k+2]-eye[2]],z=dot(rel,fwd);
    projected[k]=w/2+dot(rel,right)*focal/Math.max(z,.1);
    projected[k+1]=h/2-dot(rel,up)*focal/Math.max(z,.1);
    projected[k+2]=z;
   }
   for(const face of m.faces){
    const a=face[0]*3,b=face[1]*3,c=face[2]*3;
    if(projected[a+2]<.1||projected[b+2]<.1||projected[c+2]<.1)continue;
    screen.push([ (projected[a+2]+projected[b+2]+projected[c+2])/3,
     projected[a],projected[a+1],projected[b],projected[b+1],projected[c],projected[c+1],face[3]]);
   }
  }
  screen.sort((a,b)=>b[0]-a[0]);
  let prev='';
  for(const t of screen){
   if(prev!==t[7]){ctx.fillStyle=t[7];prev=t[7]}
   ctx.beginPath();ctx.moveTo(t[1],t[2]);ctx.lineTo(t[3],t[4]);ctx.lineTo(t[5],t[6]);ctx.closePath();ctx.fill();
  }
 }
 function requestDraw(){if(frameQueued)return;frameQueued=true;requestAnimationFrame(draw)}
 requestDraw();
 const pointers=new Map();let pinch=null;
 canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);auto=false;document.getElementById('spin').classList.remove('active')});
 canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1){yaw+=(e.clientX-prev[0])*.012;pitch=Math.max(-.12,Math.min(1.43,pitch+(e.clientY-prev[1])*.009))}
  else{const pp=[...pointers.values()],d=Math.hypot(pp[0][0]-pp[1][0],pp[0][1]-pp[1][1]);if(pinch)dist=Math.max(3.1,Math.min(10,dist*pinch/d));pinch=d}
  requestDraw();
 });
 for(const evt of ['pointerup','pointercancel'])canvas.addEventListener(evt,e=>{pointers.delete(e.pointerId);pinch=null});
 canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.1,Math.min(10,dist*Math.exp(e.deltaY*.001)));requestDraw()},{passive:false});
 const views={front:[Math.PI,.15],right:[Math.PI/2,.2],rear:[0,.13],top:[Math.PI,1.42],three:[2.4,.35]};
 for(const b of document.querySelectorAll('button[data-view]'))b.addEventListener('click',()=>{[yaw,pitch]=views[b.dataset.view];dist=5.35;auto=false;document.getElementById('spin').classList.remove('active');document.querySelectorAll('button[data-view]').forEach(x=>x.classList.toggle('active',x===b));requestDraw()});
 document.getElementById('spin').addEventListener('click',e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto)});
 setInterval(()=>{if(auto){yaw+=.075;requestDraw()}},160);
})();
</script>
</body>
</html>
