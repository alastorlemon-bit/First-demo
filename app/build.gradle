plugins {
    id 'com.android.application'
}
android {
    namespace 'com.kiira.platformerdemo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kiira.platformerdemo'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
