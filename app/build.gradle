plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alastorlemon.kiiraplatformer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alastorlemon.kiiraplatformer'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '0.14'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
