<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Аркхем — тест тайлов и подземелья</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            padding: 6px;
            position: relative;
        }
        #map {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            background: #000;
            padding: 3px;
            border: 3px solid #4a4a6a;
            border-radius: 8px;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 340px;
            max-height: 340px;
            position: relative;
            z-index: 1;
        }
        .tile {
            position: relative;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            border-radius: 2px;
            overflow: hidden;
            transition: filter 0.25s;
        }
        .tile.void-tile {
            background: #000;
            border: 1px solid #0a0a0a;
        }
        .tile.void-tile .tile-bg,
        .tile.void-tile .label,
        .tile.void-tile .hero-icon,
        .tile.void-tile .fog-overlay {
            display: none;
        }
        .tile.fog-hidden {
            filter: brightness(0);
        }
        .tile.fog-adjacent {
            filter: brightness(0.35) saturate(0.1);
        }
        .tile.fog-adjacent .fog-overlay {
            position: absolute;
            inset: 0;
            background: rgba(60, 60, 60, 0.55);
            z-index: 6;
            pointer-events: none;
        }
        .tile.fog-visible {
            filter: none;
        }
        .tile-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            image-rendering: auto;
        }
        .tile .label {
            color: #fff;
            font-size: clamp(10px, 3vw, 14px);
            text-align: center;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 6px #000, 0 0 3px #000;
            line-height: 1.2;
            padding: 2px;
            position: relative;
        }
        .tile .hero-icon {
            font-size: clamp(28px, 8vw, 42px);
            z-index: 5;
            position: absolute;
            filter: drop-shadow(0 0 8px #ffcc00);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Глобальная подсказка */
        #global-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            background: rgba(0, 0, 0, 0.92);
            color: #ffcc00;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            border: 1px solid #ffcc0066;
            text-shadow: 0 0 4px #000;
            opacity: 0;
            transition: opacity 0.1s;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            margin-top: -24px;
        }
        #global-tooltip.visible {
            opacity: 1;
        }

        #info {
            color: #ccc;
            font-size: clamp(12px, 3vw, 15px);
            text-align: center;
            background: #111;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            width: 100%;
            max-width: 340px;
        }
        #debug {
            color: #ff9900;
            font-size: 10px;
            text-align: center;
            max-width: 340px;
            word-break: break-all;
            min-height: 14px;
        }
        #controls {
            display: grid;
            grid-template-columns: 55px 55px 55px;
            grid-template-rows: 55px 55px 55px;
            gap: 5px;
            justify-content: center;
        }
        .ctrl-btn {
            background: #1a1a2e;
            border: 2px solid #4a4a6a;
            border-radius: 14px;
            color: #ccc;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
        }
        .ctrl-btn:active {
            background: #2a2a4e;
            border-color: #ffcc00;
        }
        #btn-up {
            grid-column: 2;
            grid-row: 1;
        }
        #btn-left {
            grid-column: 1;
            grid-row: 2;
        }
        #btn-center {
            grid-column: 2;
            grid-row: 2;
            font-size: 11px;
            border-color: #ffcc0066;
            color: #ffcc00;
        }
        #btn-right {
            grid-column: 3;
            grid-row: 2;
        }
        #btn-down {
            grid-column: 2;
            grid-row: 3;
        }
        .bottom-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 340px;
        }
        .action-btn {
            flex: 1;
            height: 44px;
            font-size: 13px;
            border-radius: 22px;
            border: 2px solid;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        #btn-new-game {
            background: #1a2a1a;
            border-color: #2a5a2a;
            color: #4aff4a;
        }
        #btn-new-game:active {
            background: #2a4a2a;
            border-color: #6aff6a;
        }
        #btn-map-hold {
            background: #1a1a3a;
            border-color: #3a3a6a;
            color: #aaaaff;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #btn-map-hold:active {
            background: #2a2a5a;
            border-color: #6a6aff;
        }

        #btn-tiles { background: #29241b; border-color: #66523d; color: #efd8ae; }
        .action-btn { min-width: 0; font-size: clamp(11px, 3vw, 13px); white-space: nowrap; }
        #tiles-overlay { display:none; position:fixed; inset:0; width:100vw; height:100dvh; z-index:150;
            background:rgba(5,5,7,.97); align-items:center; justify-content:center;
            flex-direction:column; gap:8px; padding:12px; overflow-y:auto; color:#ddd; }
        #tiles-overlay.active { display:flex; }
        .tiles-header { width:min(92vw,430px); display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:15px; }
        .tiles-button { background:#29252a; color:#eee; border:1px solid #75685e; border-radius:10px;
            min-height:38px; padding:7px 9px; font:inherit; cursor:pointer; }
        .tiles-button:active, .tiles-button.selected { border-color:#f0c174; background:#4c392a; }
        #tiles-preview { width:min(88vw,46dvh,430px); aspect-ratio:1; background:#000; overflow:hidden; flex:none; }
        #tiles-preview img { display:block; width:100%; height:100%; object-fit:contain; }
        #tiles-status { min-height:18px; font-size:12px; color:#bcae93; text-align:center; }
        #tiles-types, #tiles-rotation { width:min(92vw,430px); display:grid; gap:6px; }
        #tiles-types { grid-template-columns:repeat(2,minmax(0,1fr)); }
        #tiles-rotation { grid-template-columns:repeat(2,minmax(0,1fr)); }
        #tiles-hint { max-width:430px; color:#9d998e; font-size:11px; text-align:center; line-height:1.3; }
        @media(max-height:670px) {
            #map { max-width:min(340px,38dvh); }
            #controls { grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); }
            #game-container { gap:5px; }
            #tiles-overlay { justify-content:flex-start; }
        }
        #full-map-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        #full-map-overlay.active {
            display: flex;
        }
        #full-map-grid {
            display: grid;
            gap: 2px;
            background: #000;
            padding: 2px;
            border: 3px solid #5a5a8a;
            border-radius: 8px;
            max-width: 95vw;
            max-height: 90vh;
            overflow: auto;
        }
        .full-tile {
            aspect-ratio: 1 / 1;
            background: #0d0d0d;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            min-height: 36px;
            overflow: hidden;
        }
        .full-tile.void-tile {
            background: #000;
            border: 1px solid #0a0a0a;
        }
        .full-tile.void-tile .tile-bg,
        .full-tile.void-tile .label {
            display: none;
        }
        .full-tile .tile-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .full-tile .label {
            color: #fff;
            font-size: clamp(10px, 2.5vw, 20px);
            text-align: center;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 6px #000;
            position: relative;
        }
        .full-tile.hero-tile .label {
            color: #ffcc00;
            font-weight: bold;
        }
        .full-tile.entrance-tile .label {
            color: #4aff4a;
        }
        .full-tile.map-hidden {
            filter: brightness(0);
        }
        .full-tile.map-visible {
            filter: none;
        }
        .full-tile.map-adjacent {
            filter: brightness(0.35) saturate(0.1);
        }
        .full-tile.map-adjacent::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(60, 60, 60, 0.55);
            z-index: 6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        <div id="info">🧙 <span id="tile-name">Вход</span> | 🗺️ <span id="hero-coords">(0, 0)</span></div>
        <div id="debug"></div>
        <div id="controls">
            <button class="ctrl-btn" id="btn-up">▲</button>
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-center">СБРОС</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-down">▼</button>
        </div>
        <div class="bottom-buttons">
            <button class="action-btn" id="btn-new-game">🔄 Игра</button>
            <button class="action-btn" id="btn-map-hold" title="Удерживать для просмотра">🗺️ Карта</button>
            <button class="action-btn" id="btn-tiles">🧱 Тайлы</button>
        </div>
    </div>
    <div id="global-tooltip"></div>
    <div id="full-map-overlay">
        <div id="full-map-grid"></div>
    </div>

    <div id="tiles-overlay" role="dialog" aria-modal="true" aria-label="Просмотр графических тайлов">
        <div class="tiles-header"><strong>Графика комнат · 4 типа</strong><button class="tiles-button" id="btn-close-tiles">Закрыть ×</button></div>
        <div id="tiles-preview"><img id="tiles-image" alt="Выбранный тайл"></div>
        <div id="tiles-status" aria-live="polite"></div>
        <div id="tiles-types">
            <button class="tiles-button" data-tile="0">2 · поворот</button>
            <button class="tiles-button" data-tile="1">2 · коридор</button>
            <button class="tiles-button" data-tile="2">3 · развилка</button>
            <button class="tiles-button" data-tile="3">4 · перекрёсток</button>
        </div>
        <div id="tiles-rotation"><button class="tiles-button" id="btn-tiles-left">↺ 90°</button><button class="tiles-button" id="btn-tiles-right">90° ↻</button></div>
        <div id="tiles-hint">Проверка расположения проёмов, толщины рамки и стыков. Повороты меняют только изображение, карта остаётся прежней.</div>
    </div>

    <script>
        // ==================== ФОНОВЫЕ ИЗОБРАЖЕНИЯ ====================
        const BG_IMAGES = {
            '4': 'assets/tile_4.png',
            '3': 'assets/tile_3.png',
            '2_straight': 'assets/tile_2_straight.jpg',
            '2_corner': 'assets/tile_2_corner.png',
        };
        function countOpenings(mask) { return mask.filter(v => v === 1).length; }
        function areOpeningsOpposite(mask) { return (mask[0] === 1 && mask[2] === 1) || (mask[1] === 1 && mask[3] ===
            1); }
        function areOpeningsAdjacent(mask) { const o = []; for (let i = 0; i < 4; i++) if (mask[i] === 1) o.push(i); if (
                o.length !== 2) return false; const d = Math.abs(o[0] - o[1]); return d === 1 || d === 3; }
        function getBgImage(mask) { const c = countOpenings(mask); if (c >= 4) return BG_IMAGES['4']; if (c === 3) return BG_IMAGES[
                '3']; if (c === 2) return areOpeningsOpposite(mask) ? BG_IMAGES['2_straight'] : BG_IMAGES[
            '2_corner']; return BG_IMAGES['2_straight']; }

        function getBgRotation(mask) { const c = countOpenings(mask); if (c === 2 && areOpeningsAdjacent(mask)) { const o =
                []; for (let i = 0; i < 4; i++) if (mask[i] === 1) o.push(i); const k = o.sort().join(','); return {
                    '1,2': 0,
                    '2,3': 90,
                    '0,3': 180,
                    '0,1': 270
                } [k] || 0; } if (c === 2 && areOpeningsOpposite(mask)) return (mask[0] === 1 && mask[2] === 1) ? 90 :
            0; if (c === 3) { const w = mask.findIndex(v => v === 0); return { 2: 0, 3: 90, 0: 180, 1: 270 } [w] ||
                0; } return 0; }

        // ==================== 22 ТАЙЛА ====================
        const ALL_TILES = [
            { id: 1, name: 'Вход', icon: '🚪', mask: [1, 1, 1, 1] }, { id: 2, name: 'Перекресток', icon: '✚', mask: [1,
                    1, 1, 1
                ] }, { id: 3, name: 'Перекресток2', icon: '✚', mask: [1, 1, 1, 1] }, { id: 4, name: 'Поворот',
                icon: '↷', mask: [0, 1, 1, 0] }, { id: 5, name: 'Поворот2', icon: '↷', mask: [0, 1, 1, 0] }, { id: 6,
                name: 'Поворот3', icon: '↷', mask: [0, 1, 1, 0] }, { id: 7, name: 'Поворот4', icon: '↷', mask: [0, 1,
                    1, 0
                ] }, { id: 8, name: 'Поворот5', icon: '↷', mask: [0, 1, 1, 0] }, { id: 9, name: 'Мост', icon: '🌉',
                mask: [0, 1, 0, 1] }, { id: 10, name: 'Коридор', icon: '🚪', mask: [0, 1, 0, 1] }, { id: 11,
                name: 'Тёмн. коридор', icon: '🚪', mask: [0, 1, 0, 1] }, { id: 12, name: 'Библиотека', icon: '📚',
                mask: [1, 1, 0, 1] }, { id: 13, name: 'Святилище', icon: '🕯️', mask: [1, 1, 0, 1] }, { id: 14,
                name: 'Святилище2', icon: '🔥', mask: [1, 1, 0, 1] }, { id: 15, name: 'Зеркальная', icon: '🪞',
                mask: [1, 1, 0, 1] }, { id: 16, name: 'Казармы', icon: '⚔️', mask: [1, 1, 0, 1] }, { id: 17,
                name: 'Пыточная', icon: '⛓️', mask: [1, 1, 0, 1] }, { id: 18, name: 'Кузница', icon: '🔨', mask: [1,
                    1, 0, 1
                ] }, { id: 19, name: 'Алхимик', icon: '🧪', mask: [1, 1, 0, 1] }, { id: 20, name: 'Т-перекр.',
                icon: '➕', mask: [1, 1, 0, 1] }, { id: 21, name: 'Т-перекр.2', icon: '➕', mask: [1, 1, 0, 1] },
            { id: 22, name: 'Тронный зал', icon: '👑', mask: [1, 1, 1, 1] },
        ];

        function rotateMask(mask, r) { let m = [...mask]; for (let i = 0; i < r; i++) m = [m[3], m[0], m[1], m[2]];
            return m; }

        function getTileVariants(tile) { const v = [],
                s = new Set(); for (let r = 0; r < 4; r++) { const m = rotateMask(tile.mask, r),
                    k = m.join(','); if (!s.has(k)) { s.add(k);
                    v.push({ mask: m, rotation: r }); } } return v; }
        const TILE_VARIANTS = ALL_TILES.map(t => ({ id: t.id, name: t.name, icon: t.icon, variants: getTileVariants(
            t) }));

        // ==================== ГЕНЕРАЦИЯ ====================
        let worldMap = {},
            heroX = 0,
            heroY = 0,
            minX = 0,
            maxX = 0,
            minY = 0,
            maxY = 0;
        let visitedTiles = new Set(),
            seenTiles = new Set();
        const DIRS = [{ dx: 0, dy: -1, s: 0, o: 2 }, { dx: 1, dy: 0, s: 1, o: 3 }, { dx: 0, dy: 1, s: 2, o: 0 }, { dx: -1,
            dy: 0, s: 3, o: 1 }];

        function k(x, y) { return `${x},${y}`; }

        function fits(mask, x, y, map) { for (const d of DIRS) { const nk = k(x + d.dx, y + d.dy); if (map.hasOwnProperty(
                nk) && mask[d.s] !== map[nk].mask[d.o]) return false; } return true; }

        function isConnected(map) { if (!map.hasOwnProperty('0,0')) return false;
            const vis = new Set(['0,0']),
                q = ['0,0']; while (q.length) { const key = q.shift(),
                    [cx, cy] = key.split(',').map(Number),
                    t = map[key]; for (const d of DIRS) { if (t.mask[d.s] === 1) { const nk = k(cx + d.dx, cy + d.dy); if (
                            map.hasOwnProperty(nk) && !vis.has(nk)) { vis.add(nk);
                            q.push(nk); } } } } return vis.size === Object.keys(map).length; }

        function emptyNeighbors(map) { const s = new Set(); for (const key in map) { const [cx, cy] = key.split(',').map(
                Number); for (const d of DIRS) { const nk = k(cx + d.dx, cy + d.dy); if (!map.hasOwnProperty(nk)) s.add(
                    nk); } } return Array.from(s).map(kk => { const [x, y] = kk.split(',').map(Number); return { x, y,
                    key: kk }; }); }

        function generateWorld() {
            const t0 = performance.now();
            let success = false,
                attempt = 0;
            const MAX = 200;
            while (!success && attempt < MAX) { attempt++; const map = {},
                    used = new Set(); let mx = 0,
                    MX = 0,
                    my = 0,
                    MY = 0; const ent = TILE_VARIANTS.find(t => t.id === 1);
                map['0,0'] = { id: 1, name: ent.name, icon: ent.icon, mask: [1, 1, 1, 1] };
                used.add(1); let ok = true; while (used.size < 22 && ok) { const cells = emptyNeighbors(map); if (!cells
                        .length) { ok = false; break; }
                    cells.sort(() => Math.random() - 0.5);
                    cells.sort((a, b) => { const ca = DIRS.filter(d => map.hasOwnProperty(k(a.x + d.dx, a.y + d.dy)))
                            .length,
                            cb = DIRS.filter(d => map.hasOwnProperty(k(b.x + d.dx, b.y + d.dy))).length; return cb -
                            ca; }); let placed = false; const topN = Math.min(cells.length, 5); const candidates = cells
                        .slice(0, topN).sort(() => Math.random() - 0.5); for (const cell of candidates) { if (map
                            .hasOwnProperty(cell.key)) continue; const avail = TILE_VARIANTS.filter(t => !used.has(t
                            .id)); const shuffled = [...avail].sort(() => Math.random() - 0.5); for (const tile of
                            shuffled) { const sv = [...tile.variants].sort(() => Math.random() - 0.5); for (const v of
                                sv) { if (!fits(v.mask, cell.x, cell.y, map)) continue;
                            map[cell.key] = { id: tile.id, name: tile.name, icon: tile.icon, mask: v.mask }; if (
                                isConnected(map)) { used.add(tile.id); if (cell.x < mx) mx = cell.x; if (cell.x >
                                    MX) MX = cell.x; if (cell.y < my) my = cell.y; if (cell.y > MY) MY = cell
                                    .y;
                                placed = true; break; } else { delete map[cell.key]; } } if (placed)
                            break; } if (placed) break; } if (!placed) ok = false; } if (ok && used.size === 22 &&
                    isConnected(map)) { worldMap = map;
                    minX = mx;
                    maxX = MX;
                    minY = my;
                    maxY = MY;
                    success = true; } }
            visitedTiles = new Set();
            visitedTiles.add('0,0');
            seenTiles = new Set();
            markAdjacentAsSeen(0, 0); const el = document.getElementById('debug'); const dt = (performance.now() - t0)
                .toFixed(0); if (success) el.textContent =
                `✅ 22/22 связны | ${minX}..${maxX}, ${minY}..${maxY} | ${dt}мс`;
            else { el.textContent = `⚠️ Fallback | ${dt}мс`;
                buildFallback(); }
        }

        function buildFallback() { worldMap = {}; const used = new Set(); const ent = TILE_VARIANTS.find(t => t.id ===
            1);
            worldMap['0,0'] = { id: 1, name: ent.name, icon: ent.icon, mask: [1, 1, 1, 1] };
            used.add(1);
            minX = maxX = minY = maxY = 0; const dirs = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0,
                dy: -1 }]; let cx = 1,
                cy = 0,
                d = 0; const rem = TILE_VARIANTS.filter(t => !used.has(t.id)); for (const tile of rem) { if (used.size >=
                    22) break; const key = k(cx, cy); if (worldMap[key]) { cx += dirs[d].dx;
                    cy += dirs[d].dy; continue; } let placed = false; for (const v of tile.variants) { if (fits(v.mask,
                        cx, cy, worldMap)) { worldMap[key] = { id: tile.id, name: tile.name, icon: tile.icon,
                        mask: v.mask };
                    used.add(tile.id); if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY =
                        cy; if (cy > maxY) maxY = cy;
                    placed = true; break; } } if (!placed) { worldMap[key] = { id: tile.id, name: tile.name,
                        icon: tile.icon, mask: tile.variants[0].mask };
                    used.add(tile.id); }
                cx += dirs[d].dx;
                cy += dirs[d].dy; if (cx > 5 || cx < -5 || cy > 5 || cy < -5) { d = (d + 1) % 4;
                    cx = Math.max(-5, Math.min(5, cx));
                    cy = Math.max(-5, Math.min(5, cy)); } }
            visitedTiles = new Set();
            visitedTiles.add('0,0');
            seenTiles = new Set();
            markAdjacentAsSeen(0, 0); }

        function markAdjacentAsSeen(hx, hy) { const ht = worldMap[k(hx, hy)]; if (!ht) return; for (const d of DIRS) { if (
                ht.mask[d.s] === 1) { const nk = k(hx + d.dx, hy + d.dy); if (worldMap.hasOwnProperty(nk) && !visitedTiles
                    .has(nk)) { const nt = worldMap[nk]; if (nt && nt.mask[d.o] === 1) seenTiles.add(nk); } } } }

        function getFogClass(wx, wy) { const key = k(wx, wy); if (!worldMap.hasOwnProperty(key)) return 'void-tile'; if (
                visitedTiles.has(key)) return 'fog-visible'; if (seenTiles.has(key)) return 'fog-adjacent'; const ht =
                worldMap[k(heroX, heroY)]; if (ht) { for (const d of DIRS) { if (ht.mask[d.s] === 1) { const nk = k(
                            heroX + d.dx, heroY + d.dy); if (nk === key) { const nt = worldMap[nk]; if (nt && nt.mask[d
                                .o] === 1) { seenTiles.add(nk); return 'fog-adjacent'; } } } } } return 'fog-hidden'; }

        // ==================== ГЕРОЙ ====================
        function canMove(fx, fy, tx, ty) { const a = worldMap[k(fx, fy)],
                b = worldMap[k(tx, ty)]; if (!a || !b) return false; let fs, ts; if (tx === fx && ty === fy - 1) { fs = 0;
                ts = 2; } else if (tx === fx + 1 && ty === fy) { fs = 1;
                ts = 3; } else if (tx === fx && ty === fy + 1) { fs = 2;
                ts = 0; } else if (tx === fx - 1 && ty === fy) { fs = 3;
                ts = 1; } else return false; return a.mask[fs] === 1 && b.mask[ts] === 1; }

        function moveHero(dx, dy) { const nx = heroX + dx,
                ny = heroY + dy; if (canMove(heroX, heroY, nx, ny)) { heroX = nx;
                heroY = ny;
                visitedTiles.add(k(heroX, heroY));
                seenTiles.delete(k(heroX, heroY));
                markAdjacentAsSeen(heroX, heroY);
                hideTooltip();
                renderView(); } else flashDenied(); }

        function moveHeroTo(wx, wy) {
            const dx = wx - heroX;
            const dy = wy - heroY;
            if (Math.abs(dx) + Math.abs(dy) === 1) moveHero(dx, dy);
        }

        function resetHero() { heroX = 0;
            heroY = 0;
            hideTooltip();
            renderView(); }

        function flashDenied() { const m = document.getElementById('map');
            m.style.boxShadow = '0 0 20px #f00';
            setTimeout(() => m.style.boxShadow = '', 150); }

        // ==================== ПОДСКАЗКА ====================
        const tooltipEl = document.getElementById('global-tooltip');
        let tooltipTimer = null;
        let activeTileKey = null;
        const HOLD_DURATION = 400;
        let lastTapTime = 0;
        let lastTapKey = null;
        const DOUBLE_TAP_WINDOW = 350;

        function showTooltipAt(e, tileName, key) {
            hideTooltip();
            activeTileKey = key;
            tooltipEl.textContent = tileName;
            tooltipEl.style.left = e.clientX + 'px';
            tooltipEl.style.top = (e.clientY - 32) + 'px';
            tooltipEl.classList.add('visible');
        }

        function hideTooltip() {
            tooltipEl.classList.remove('visible');
            activeTileKey = null;
            if (tooltipTimer) { clearTimeout(tooltipTimer);
                tooltipTimer = null; }
        }

        function createTileElement(tile, fogClass, wx, wy, cls = '') {
            const div = document.createElement('div');
            div.className = 'tile ' + fogClass + (cls ? ' ' + cls : '');
            div.dataset.wx = wx;
            div.dataset.wy = wy;
            if (fogClass === 'void-tile' || !tile) return div;

            const bg = document.createElement('img');
            bg.className = 'tile-bg';
            bg.src = getBgImage(tile.mask);
            bg.alt = '';
            bg.draggable = false;
            const rot = getBgRotation(tile.mask);
            if (rot !== 0) { bg.style.transform = `rotate(${rot}deg)`;
                bg.style.transformOrigin = 'center center'; }
            div.appendChild(bg);

            const lb = document.createElement('div');
            lb.className = 'label';
            lb.textContent = tile.icon;
            div.appendChild(lb);

            if (fogClass === 'fog-adjacent') {
                const overlay = document.createElement('div');
                overlay.className = 'fog-overlay';
                div.appendChild(overlay);
            }

            // Подсказка + двойной тап для перемещения
            if (fogClass === 'fog-visible' || fogClass === 'fog-adjacent') {
                div.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const key = k(wx, wy);

                    // Двойной тап для перемещения
                    const now = Date.now();
                    if (key === lastTapKey && (now - lastTapTime) < DOUBLE_TAP_WINDOW) {
                        // Двойной тап — перемещаемся
                        hideTooltip();
                        if (tooltipTimer) { clearTimeout(tooltipTimer);
                            tooltipTimer = null; }
                        moveHeroTo(wx, wy);
                        lastTapTime = 0;
                        lastTapKey = null;
                        return;
                    }
                    lastTapTime = now;
                    lastTapKey = key;

                    // Одинарное удержание — подсказка
                    tooltipTimer = setTimeout(() => {
                        showTooltipAt(e, tile.name, key);
                    }, HOLD_DURATION);
                });
                div.addEventListener('pointermove', (e) => {
                    if (activeTileKey === k(wx, wy)) {
                        tooltipEl.style.left = e.clientX + 'px';
                        tooltipEl.style.top = (e.clientY - 32) + 'px';
                    }
                });
                div.addEventListener('pointerup', (e) => {
                    if (tooltipTimer) { clearTimeout(tooltipTimer);
                        tooltipTimer = null; }
                    hideTooltip();
                });
                div.addEventListener('pointerleave', () => {
                    if (tooltipTimer) { clearTimeout(tooltipTimer);
                        tooltipTimer = null; }
                    hideTooltip();
                });
                div.addEventListener('pointercancel', () => {
                    if (tooltipTimer) { clearTimeout(tooltipTimer);
                        tooltipTimer = null; }
                    hideTooltip();
                });
            }

            return div;
        }

        // ==================== ОТРИСОВКА ====================
        const mapEl = document.getElementById('map'),
            tileNameEl = document.getElementById('tile-name'),
            heroCoordsEl = document.getElementById('hero-coords');

        function renderView() {
            mapEl.innerHTML = '';
            for (let vy = 0; vy < 3; vy++) {
                for (let vx = 0; vx < 3; vx++) {
                    const wx = heroX - 1 + vx;
                    const wy = heroY - 1 + vy;
                    const tile = worldMap[k(wx, wy)] || null;
                    const fogClass = getFogClass(wx, wy);
                    const isHero = (vx === 1 && vy === 1);
                    const div = createTileElement(tile, fogClass, wx, wy);
                    if (isHero && tile) {
                        const hi = document.createElement('div');
                        hi.className = 'hero-icon';
                        hi.textContent = '🧙';
                        div.appendChild(hi);
                    }
                    mapEl.appendChild(div);
                }
            }
            const ct = worldMap[k(heroX, heroY)];
            tileNameEl.textContent = ct ? ct.name : '???';
            heroCoordsEl.textContent = `(${heroX}, ${heroY})`;
        }

        function renderFullMap() {
            const grid = document.getElementById('full-map-grid');
            grid.innerHTML = '';
            const cols = maxX - minX + 1,
                rows = maxY - minY + 1;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            const cs = Math.max(Math.min(Math.floor(90 / cols), Math.floor(80 / rows), 50), 30);
            for (let y = minY; y <= maxY; y++)
                for (let x = minX; x <= maxX; x++) {
                    const t = worldMap[k(x, y)] || null,
                        key = k(x, y),
                        isHero = x === heroX && y === heroY,
                        isEntr = x === 0 && y === 0 && !isHero,
                        isVisited = visitedTiles.has(key),
                        isSeen = seenTiles.has(key);
                    let mc = 'map-hidden'; if (t) { if (isVisited) mc = 'map-visible'; else if (isSeen) mc =
                        'map-adjacent'; } if (!t) mc = 'void-tile';
                    const div = document.createElement('div');
                    div.className = 'full-tile ' + mc;
                    div.style.minWidth = div.style.minHeight = div.style.width = div.style.height = cs + 'px'; if (t && (
                            isVisited || isSeen)) { const bg = document.createElement('img');
                        bg.className = 'tile-bg';
                        bg.src = getBgImage(t.mask);
                        bg.alt = '';
                        bg.draggable = false; const rot = getBgRotation(t.mask); if (rot !== 0) { bg.style.transform =
                                `rotate(${rot}deg)`;
                            bg.style.transformOrigin = 'center center'; }
                        div.appendChild(bg); const lb = document.createElement('div');
                        lb.className = 'label';
                        lb.textContent = t.icon;
                        div.appendChild(lb); } if (isEntr && t && isVisited) div.classList.add('entrance-tile'); if (
                        isHero && t) { div.classList.add('hero-tile'); const hi = document.createElement('div');
                        hi.className = 'hero-icon';
                        hi.textContent = '🧙';
                        hi.style.fontSize = cs * 0.6 + 'px';
                        div.appendChild(hi); }
                    grid.appendChild(div);
                }
        }

        function openMap() { renderFullMap();
            document.getElementById('full-map-overlay').classList.add('active'); }

        function closeMap() { document.getElementById('full-map-overlay').classList.remove('active'); }
        const btnHold = document.getElementById('btn-map-hold');
        let timer = null;
        btnHold.addEventListener('pointerdown', e => { e.preventDefault();
            timer = setTimeout(openMap, 200); });
        btnHold.addEventListener('pointerup', e => { e.preventDefault(); if (timer) { clearTimeout(timer);
                timer = null; } closeMap(); });
        btnHold.addEventListener('pointerleave', () => { if (timer) { clearTimeout(timer);
                timer = null; } closeMap(); });
        btnHold.addEventListener('pointercancel', () => { if (timer) { clearTimeout(timer);
                timer = null; } closeMap(); });
        document.getElementById('full-map-overlay').addEventListener('pointerdown', e => { if (e.target === e
                .currentTarget) closeMap(); });

        function newGame() { console.clear();
            console.log('🎲 Новая игра!');
            closeMap();
            closeTiles();
            hideTooltip();
            generateWorld();
            heroX = 0;
            heroY = 0;
            renderView();
            const m = document.getElementById('map');
            m.style.boxShadow = '0 0 30px #4f4';
            setTimeout(() => m.style.boxShadow = '', 300); }

        document.getElementById('btn-up').addEventListener('click', () => moveHero(0, -1));
        document.getElementById('btn-right').addEventListener('click', () => moveHero(1, 0));
        document.getElementById('btn-down').addEventListener('click', () => moveHero(0, 1));
        document.getElementById('btn-left').addEventListener('click', () => moveHero(-1, 0));
        document.getElementById('btn-center').addEventListener('click', resetHero);
        document.getElementById('btn-new-game').addEventListener('click', newGame);
        document.addEventListener('keydown', e => {
            if (document.getElementById('tiles-overlay').classList.contains('active')) {
                if (e.key === 'Escape') { e.preventDefault(); closeTiles(); }
                return;
            }
            if (document.getElementById('full-map-overlay').classList.contains('active')) { if (e.key ===
                    'Escape') { e.preventDefault();
                    closeMap(); } return; }
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    moveHero(0, -1);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    moveHero(1, 0);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    moveHero(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    moveHero(-1, 0);
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    resetHero();
                    break;
                case 'n':
                case 'N':
                    e.preventDefault();
                    newGame();
                    break;
                case 'm':
                case 'M':
                    e.preventDefault();
                    openMap();
                    break;
                case 'Escape':
                    e.preventDefault();
                    closeMap();
                    break;
            }
        });

        // Отдельная графическая лаборатория: не влияет на логику исходной карты.
        const TILE_GALLERY = [
            { label:'Поворот · выходы справа/снизу', source:BG_IMAGES['2_corner'] },
            { label:'Коридор · выходы слева/справа', source:BG_IMAGES['2_straight'] },
            { label:'Развилка · выходы сверху/слева/справа', source:BG_IMAGES['3'] },
            { label:'Перекрёсток · четыре выхода', source:BG_IMAGES['4'] }
        ];
        let galleryIndex=0, galleryRotation=0;
        const galleryOverlay=document.getElementById('tiles-overlay');
        const galleryImage=document.getElementById('tiles-image');
        const galleryStatus=document.getElementById('tiles-status');
        function renderTiles() {
            const tile=TILE_GALLERY[galleryIndex];
            galleryImage.src=tile.source;
            galleryImage.style.transform='rotate('+galleryRotation+'deg)';
            galleryImage.alt=tile.label;
            galleryStatus.textContent=tile.label+' · '+galleryRotation+'°';
            document.querySelectorAll('[data-tile]').forEach(b=>{
                const selected=Number(b.dataset.tile)===galleryIndex;
                b.classList.toggle('selected',selected);
                b.setAttribute('aria-pressed',String(selected));
            });
        }
        function openTiles() { closeMap(); galleryOverlay.classList.add('active'); renderTiles(); }
        function closeTiles() { galleryOverlay.classList.remove('active'); }
        galleryImage.addEventListener('error',()=>{galleryStatus.textContent='Ошибка загрузки: '+TILE_GALLERY[galleryIndex].source;});
        document.getElementById('btn-tiles').addEventListener('click',openTiles);
        document.getElementById('btn-close-tiles').addEventListener('click',closeTiles);
        document.querySelectorAll('[data-tile]').forEach(b=>b.addEventListener('click',()=>{
            galleryIndex=Number(b.dataset.tile); galleryRotation=0; renderTiles();
        }));
        document.getElementById('btn-tiles-left').addEventListener('click',()=>{
            galleryRotation=(galleryRotation+270)%360; renderTiles();
        });
        document.getElementById('btn-tiles-right').addEventListener('click',()=>{
            galleryRotation=(galleryRotation+90)%360; renderTiles();
        });

        // Свайпы убраны — только двойной тап
        console.log('🎲 Генерация...');
        generateWorld();
        renderView();
        console.log('✅ Готово!');
    </script>
</body>
</html>
