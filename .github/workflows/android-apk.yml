name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch Phaser for offline operation
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/phaser.min.js https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js || \
          curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/phaser.min.js https://unpkg.com/phaser@3.90.0/dist/phaser.min.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          old = "loadPhaser(['https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']);"
          assert old in s, 'Phaser loader missing or changed'
          p.write_text(s.replace(old, "loadPhaser(['phaser.min.js']);"), encoding='utf-8')
          PY
          test -s app/src/main/assets/phaser.min.js
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiira-Platformer-v0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="demo-v0.2-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#Kiira-Platformer-demo-v0.2.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Kiira Platformer demo v0.2 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Technical prototype: sprites, Arcade Physics, scanner and light bridges. Offline Phaser. Debug APK; different builds may require reinstall."
