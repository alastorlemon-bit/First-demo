name: Build Kiira platformer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-platformer-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out First-demo
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Python image processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install Pillow==11.3.0

      - name: Reassemble original v0.2 HTML and bundle Phaser for offline play
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat websrc/part_[0-9][0-9].txt > app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          assert len(s)>4_900_000, 'Demo HTML is incomplete'
          needle="loadPhaser(['https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js','https://unpkg.com/phaser@3.90.0/dist/phaser.min.js']);"
          if needle in s:
              s=s.replace(needle,"loadPhaser(['phaser.min.js']);")
          assert "loadPhaser(['phaser.min.js']);" in s, 'Local Phaser loader missing'
          p.write_text(s,encoding='utf-8')
          PY
          python3 game/audio_controls_patch.py app/src/main/assets/index.html
          # Validate the actual generated JS, not just the Python patch source.
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text('utf-8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.S)
          assert scripts, 'No inline game script found'
          game=scripts[-1]
          assert 'scene_v15_darkness' in game
          assert 'paintCompositeLighting(this.compositeLight,ox,oy,outer,mid,core)' in game
          assert 'this.revealBackground' not in game
          assert 'this.revealMaskGraphics' not in game
          assert 'this.midArchitecture' in game
          assert 'this.staticLampGlow' in game
          assert 'this.platformFaces' in game
          assert 'this.sceneVignette' in game
          assert 'jump:460,gravity:640' in game
          Path('/tmp/neon-v15-check.js').write_text(game,'utf-8')
          print('Renderer single-pass and all visual systems present:',len(game),'JS chars')
          PY
          node --check /tmp/neon-v15-check.js
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js' -o app/src/main/assets/phaser.min.js || curl --fail --location --retry 3 'https://unpkg.com/phaser@3.90.0/dist/phaser.min.js' -o app/src/main/assets/phaser.min.js
          test -s app/src/main/assets/phaser.min.js

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/kiira-neon-platformer-v0.15.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiira-neon-platformer-v15
          path: release/kiira-neon-platformer-v0.15.apk
          if-no-files-found: error

      - name: Publish downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view preview-apk-v15 >/dev/null 2>&1; then
            gh release upload preview-apk-v15 release/kiira-neon-platformer-v0.15.apk --clobber
          else
            gh release create preview-apk-v15 release/kiira-neon-platformer-v0.15.apk --title "Kiira platformer - technical preview" --notes "One-screen Android WebView / Phaser prototype v0.15. Renderer optimized: single composite lightmap, full perspective/lamps/vignette/3D preserved; physics unchanged. Offline Phaser included. Debug APK." --prerelease
          fi
